version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paktradex_api
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=PakTradeX API
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/paktradex
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: paktradex_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=paktradex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
